[project]
name = "bling-sdk"
version = "0.1.0"
description = "SDK Python para a API v3 do Bling ERP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]
keywords = ["bling", "erp", "api", "oauth2", "nfe", "estoque"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]

[project.scripts]
bling = "bling_sdk.auth.cli:main"

[project.optional-dependencies]
django = ["django>=4.2"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "mypy>=1.10",
       "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bling_sdk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

# Django e dependencia opcional: nao esta instalada no ambiente de dev do SDK.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

# O modelo abstrato herda de django.db.models.Model, que sem stubs e Any.
[[tool.mypy.overrides]]
module = "bling_sdk.auth.django_store"
disable_error_code = ["misc", "import-not-found"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
